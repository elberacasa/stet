  <g stroke="#0b0d12" stroke-width="1.6" stroke-linecap="round">
    <line x1="340" y1="35" x2="362" y2="35"/><line x1="340" y1="43" x2="362" y2="43"/><line x1="340" y1="51" x2="362" y2="51"/>
  </g>
  <line x1="0" y1="72" x2="390" y2="72" stroke="#eef0f4"/>

  <text x="195" y="214" text-anchor="middle" font-family="Inter,Helvetica,system-ui,sans-serif" font-size="44" font-weight="800" letter-spacing="-1.8" fill="#0b0d12">Slow software</text>
  <text x="195" y="262" text-anchor="middle" font-family="Inter,Helvetica,system-ui,sans-serif" font-size="44" font-weight="800" letter-spacing="-1.8" fill="#0b0d12">for careful</text>
