<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Hero, variant B, desktop">
  <rect width="1200" height="750" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="72" fill="#ffffff"/>
  <text x="72" y="46" font-family="Inter,Helvetica,system-ui,sans-serif" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#0b0d12">Kettle</text>
  <g font-family="Inter,Helvetica,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5b6373">
    <text x="880" y="45">Work</text><text x="960" y="45">Studio</text><text x="1050" y="45">Contact</text>
  </g>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#eef0f4"/>

  <text x="600" y="256" text-anchor="middle" font-family="Inter,Helvetica,system-ui,sans-serif" font-size="80" font-weight="800" letter-spacing="-3" fill="#0b0d12">Slow software</text>
  <text x="600" y="342" text-anchor="middle" font-family="Inter,Helvetica,system-ui,sans-serif" font-size="80" font-weight="800" letter-spacing="-3" fill="#0b0d12">for careful people</text>
